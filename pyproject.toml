[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "PyGridPlot"
dynamic = ["version", "readme"]
description = "Interactive, zoomable Cartesian planes for pygame-ce: an adaptive grid, robust plots of functions, curves, fields and data, and draggable points and sliders, drawn from your own main loop."
license = "LGPL-2.1-or-later"
license-files = ["LICENSE", "src/pygridplot/assets/fonts/LICENSE-DejaVu.txt"]
authors = [{ name = "GWStuart" }]
keywords = [
    "pygame",
    "pygame-ce",
    "plotting",
    "graphing",
    "cartesian-plane",
    "mathematics",
    "education",
    "visualization",
    "interactive",
    "immediate-mode",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Education",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "contourpy>=1.2",
    "numpy>=1.26",
    "pygame-ce>=2.5.7",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/GWStuart/PyGridPlot"
Documentation = "https://github.com/GWStuart/PyGridPlot/blob/HEAD/docs/index.md"
Source = "https://github.com/GWStuart/PyGridPlot"
Issues = "https://github.com/GWStuart/PyGridPlot/issues"
Changelog = "https://github.com/GWStuart/PyGridPlot/blob/HEAD/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Building: hatchling, with the version read from the package
# ---------------------------------------------------------------------------
[tool.hatch.version]
path = "src/pygridplot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pygridplot"]

# The source archive: what is needed to build, test and read the project.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/scripts",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
]
exclude = ["__pycache__"]

# The README's links are relative, so they work on GitHub and in a checkout
# (and tests/test_docs.py checks them); on PyPI they must be absolute.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Folders: link to the tree.
pattern = '\]\((?!https?://|#)([^)\s]*/)\)'
replacement = '](https://github.com/GWStuart/PyGridPlot/tree/HEAD/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Files (with or without an anchor): link to the file on the default branch.
pattern = '\]\((?!https?://|#)([^)\s]+)\)'
replacement = '](https://github.com/GWStuart/PyGridPlot/blob/HEAD/\1)'

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

# ---------------------------------------------------------------------------
# ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]
# Only lint/format Python: never rewrite code samples inside documents.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "D",    # pydocstyle (docstrings everywhere)
    "N",    # pep8-naming
    "SIM",  # simplify
    "C4",   # comprehensions
    "PIE",  # misc lints
    "RET",  # return statements
    "PT",   # pytest style
    "NPY",  # numpy-specific rules
    "RUF",  # ruff-specific rules
]
ignore = [
    "D105",  # magic methods are self-explanatory
    "D107",  # __init__ arguments are documented in the class docstring
]
allowed-confusables = ["−", "×", "–"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test functions are named descriptively; module docstrings are still required.
"tests/**" = ["D101", "D102", "D103"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true
