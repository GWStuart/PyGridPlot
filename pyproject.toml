[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "PyGridPlot"
version = "0.1.0.dev0"
description = "An interactive, pannable and zoomable Cartesian plane for pygame: an adaptive grid and smooth, robust plotting of functions, points and polygons."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pygame-ce>=2.5",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pygridplot"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

# ---------------------------------------------------------------------------
# ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]
# Only lint/format Python: never rewrite code samples inside documents.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "D",    # pydocstyle (docstrings everywhere)
    "N",    # pep8-naming
    "SIM",  # simplify
    "C4",   # comprehensions
    "PIE",  # misc lints
    "RET",  # return statements
    "PT",   # pytest style
    "NPY",  # numpy-specific rules
    "RUF",  # ruff-specific rules
]
ignore = [
    "D105",  # magic methods are self-explanatory
    "D107",  # __init__ arguments are documented in the class docstring
]
allowed-confusables = ["−", "×", "–"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test functions are named descriptively; module docstrings are still required.
"tests/**" = ["D101", "D102", "D103"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true
