# Publish to PyPI when a GitHub release is published (tag vX.Y.Z).
#
# Uses PyPI's trusted publishing, so no token is stored: on PyPI, add a
# publisher for this repository with the workflow "release.yml" and the
# environment "pypi" (see docs/dev/releasing.md).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/pygridplot/__init__.py').read_text(encoding='utf-8')).group(1))")
          echo "tag ${GITHUB_REF_NAME}, package ${version}"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/PyGridPlot/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
